services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mercuriodb}
      POSTGRES_USER: ${DB_USERNAME:-mercurio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mercurio}
      DB_TEST_DATABASE: ${DB_TEST_DATABASE:-mercuriodb_test}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mercurio} -d ${DB_DATABASE:-mercuriodb}"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025" # web UI = local "sales inbox"
      - "1025:1025" # SMTP

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${APP_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  db_data:
  backend_vendor:
  frontend_node_modules:
